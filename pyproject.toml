[project]
name = "scripts"
version = "0.1.0"
description = "Scripts para tarefas automáticas executadas na linha de comando."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cryptography>=50.0.2",
    "pypdf>=6.19.0",
    "requests>=2.34.2",
]

[project.scripts]
juntar-pdf = "juntar_pdf.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["juntar_pdf"]
